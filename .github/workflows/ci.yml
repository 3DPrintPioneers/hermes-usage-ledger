name: Plugin checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Check out the tested Hermes runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NousResearch/hermes-agent
          ref: bed0d535556b5b0a2bdd6fd3a74162ad5f860ca1
          path: hermes-runtime

      - name: Install isolated test dependencies
        run: python -m pip install -e ./hermes-runtime -r requirements-test.txt

      - name: Compile Python modules
        run: python -m py_compile ledger.py dashboard/plugin_api.py __init__.py tally_snapshot.py tally_writer.py

      - name: Run Python tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v

      - name: Run renderer tests
        run: node --experimental-vm-modules --test tests/desktop-plugin.test.mjs

      - name: Check whitespace
        run: git diff --check
